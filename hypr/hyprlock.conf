# -----------------------------------------------------
# Ancient Shell lock screen (hyprlock)
# Background: blurred copy of the wallpaper written by the shell's wallpaper hook.
# Fonts: Orbitron + Rajdhani (installed to ~/.local/share/fonts by install.sh).
# -----------------------------------------------------

$cache = $HOME/.cache/ancient-shell

$cyan  = rgba(30c6deff)
$cyanA = rgba(30c6de55)
$amber = rgba(e8a33dff)
$stone = rgba(0b0f11e6)
$line  = rgba(26343aff)
$text  = rgba(d5e3e7ff)
$dim   = rgba(8ea2a9ff)
$dome  = rgba(e5533dff)

general {
    ignore_empty_input = true
    hide_cursor = true
}

background {
    monitor =
    path = $cache/lock.png
    color = rgba(07090aff)
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 96
    font_family = Orbitron Bold
    position = 0, 190
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 12
    shadow_color = $cyanA
}

# Date
label {
    monitor =
    text = cmd[update:60000] LC_TIME=pt_BR.UTF-8 date +"%A, %d de %B" | tr '[:lower:]' '[:upper:]'
    color = $amber
    font_size = 18
    font_family = Rajdhani SemiBold
    position = 0, 105
    halign = center
    valign = center
}

# Origin glyph
label {
    monitor =
    text = Λ
    color = $cyan
    font_size = 40
    font_family = Orbitron
    position = 0, 20
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 14
    shadow_color = $cyan
}

input-field {
    monitor =
    size = 340, 54
    outline_thickness = 2
    rounding = 4
    outer_color = $line
    inner_color = $stone
    font_color = $text
    font_family = Rajdhani SemiBold
    check_color = $cyan
    fail_color = $dome
    capslock_color = $amber
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##8ea2a9">CÓDIGO DE ÍRIS</span>
    fail_text = <span foreground="##e5533d">ACESSO NEGADO ($ATTEMPTS)</span>
    position = 0, -80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 10
    shadow_color = $cyanA
}

label {
    monitor =
    text = $USER
    color = $dim
    font_size = 14
    font_family = Rajdhani SemiBold
    position = 0, -140
    halign = center
    valign = center
}
